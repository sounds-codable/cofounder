server {
    listen 80;
    listen [::]:80;
    server_name cofounder.icu www.cofounder.icu;
    server_tokens off;
    return 301 https://cofounder.icu$request_uri;
}

server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    server_name www.cofounder.icu;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cofounder.icu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cofounder.icu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://cofounder.icu$request_uri;
}

server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    server_name cofounder.icu;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cofounder.icu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cofounder.icu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/www.cofounder.icu/current/client/dist;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cofounder.icu https://www.cofounder.icu; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ @spa;
        error_page 403 = @spa;
    }

    location @spa {
        rewrite ^ /index.html last;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}