[program:cofounder-frontend]
command=/bin/bash -lc '/home/deployer/.nvm/versions/node/v20.20.1/bin/npm run start -- --port 3000'
directory=/var/www/www.cofounder.icu/current/client
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=deployer
environment=NODE_ENV="production",PORT="3000"
stdout_logfile=/var/www/www.cofounder.icu/shared/logs/frontend.stdout.log
stderr_logfile=/var/www/www.cofounder.icu/shared/logs/frontend.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile_backups=10
