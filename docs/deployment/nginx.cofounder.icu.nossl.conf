server {
    listen 80;
    listen [::]:80;
    server_name www.cofounder.icu;
    server_tokens off;
    return 301 http://cofounder.icu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cofounder.icu;
    server_tokens off;

    # 前端静态文件（Next.js v16 静态导出输出）
    root /var/www/www.cofounder.icu/current/client/dist;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://cofounder.icu http://www.cofounder.icu; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 前端静态页面与路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（NestJS 全局前缀 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
