server {
    listen 80;
    listen [::]:80;
    server_name www.cofounder.icu;
    return 301 http://cofounder.icu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cofounder.icu;

    # 前端静态文件（Taro H5 build 输出）
    root /var/www/www.cofounder.icu/current/client/dist;
    index index.html;

    # 前端路由使用 history（taro h5 router mode: browser）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（NestJS 全局前缀 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
